<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{USER}} Apps</title>
<meta name="description" content="Every app and interactive page {{USER}} has built, in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23245c4f'/%3E%3Cg fill='%23f3efe6'%3E%3Crect x='7' y='7' width='8' height='8' rx='2'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' opacity='.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f3efe6; --surface: #fffdf8; --fg: #1d2420; --muted: #5f675f; --line: #ddd6c8;
  --accent: #245c4f; --accent-soft: #dde9e2; --shot-bg: #e8e2d5; --shadow: 0 1px 2px rgb(40 35 20 / .06), 0 8px 24px -12px rgb(40 35 20 / .18);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --surface: #1c211e; --fg: #e9ebe6; --muted: #9aa39c; --line: #2c332e;
  --accent: #8fd0b8; --accent-soft: #1f342c; --shot-bg: #232a26; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -14px rgb(0 0 0 / .6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211e; --fg: #e9ebe6; --muted: #9aa39c; --line: #2c332e;
  --accent: #8fd0b8; --accent-soft: #1f342c; --shot-bg: #232a26; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -14px rgb(0 0 0 / .6);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--sans); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 48px 16px 64px; }
@media (min-width: 720px) { .wrap { padding-inline: 32px; } }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px 32px; margin-bottom: 32px; }
.eyebrow { font: 500 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font: 700 clamp(2rem, 5vw, 3rem)/1.05 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--muted); max-width: 56ch; }
.search { width: min(100%, 300px); font: 400 .95rem var(--sans); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.search:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.card[hidden] { display: none; }
.shot { display: block; text-decoration: none; aspect-ratio: 16 / 10; background: var(--shot-bg); border-bottom: 1px solid var(--line); overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .4s ease; }
.card:hover .shot img { transform: scale(1.025); }
.placeholder { height: 100%; display: grid; place-content: center; gap: 6px; text-align: center; padding: 16px; color: var(--muted); font-size: .85rem;
  background: repeating-linear-gradient(135deg, transparent 0 12px, color-mix(in srgb, var(--line) 45%, transparent) 12px 13px); }
.placeholder .mono { font: 500 .9rem var(--mono); color: var(--fg); }
.body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
h2 { font: 600 1.2rem/1.25 var(--display); letter-spacing: -.01em; margin: 0; }
h2 a { color: inherit; text-decoration: none; }
h2 a:hover { color: var(--accent); }
.body p { margin: 0; color: var(--muted); font-size: .92rem; }
.meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.host { font: 500 .7rem var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.src { color: var(--accent); text-decoration: none; margin-left: auto; font-weight: 500; }
.src:hover { text-decoration: underline; }
.empty { color: var(--muted); }
footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">{{COUNT}} apps</p>
      <h1>Things I've built</h1>
      <p class="lede">Interactive maps, explorers and tools. Click a card to open the app.</p>
    </div>
    <input class="search" id="q" type="search" placeholder="Filter apps" aria-label="Filter apps">
  </header>

  <ul class="grid" id="grid">{{CARDS}}
  </ul>
  <p class="empty" id="empty" hidden>No apps match that filter.</p>

  <footer>Thumbnails refreshed <time datetime="{{BUILT_ISO}}">{{BUILT}}</time>. New GitHub Pages sites show up here automatically.</footer>
</div>
<script>
const cards = [...document.querySelectorAll('.card')];
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  for (const c of cards) { const hit = !q || c.dataset.search.includes(q); c.hidden = !hit; shown += hit; }
  document.getElementById('empty').hidden = shown > 0;
});
</script>
</body>
</html>
